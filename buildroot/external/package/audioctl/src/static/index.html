<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RPi4 USB DAC</title>
  <style>
    :root { color-scheme: light; font-family: ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f1e8; color: #1f2933; }
    main { width: min(520px, calc(100vw - 32px)); }
    h1 { font-size: 28px; margin: 0 0 18px; }
    section { background: #fffaf0; border: 1px solid #d8d0bd; border-radius: 8px; padding: 20px; box-shadow: 0 18px 45px rgba(45, 35, 20, 0.12); }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-top: 1px solid #e5decf; }
    .row:first-child { border-top: 0; }
    .name { font-weight: 700; }
    .status { color: #586270; font-size: 14px; }
    button { border: 0; border-radius: 6px; padding: 10px 14px; font-weight: 700; background: #1f2933; color: white; cursor: pointer; }
    button.secondary { background: #7b6f5b; }
  </style>
</head>
<body>
  <main>
    <h1>RPi4 USB DAC</h1>
    <section>
      <div class="row">
        <div><div class="name">AirPlay</div><div id="airplay" class="status">unknown</div></div>
        <div><button onclick="post('/api/airplay/start')">Start</button> <button class="secondary" onclick="post('/api/airplay/stop')">Stop</button></div>
      </div>
      <div class="row">
        <div><div class="name">RoonBridge</div><div id="roon" class="status">unknown</div></div>
        <div><button onclick="post('/api/roon/start')">Start</button> <button class="secondary" onclick="post('/api/roon/stop')">Stop</button></div>
      </div>
    </section>
  </main>
  <script>
    async function refresh() {
      const res = await fetch('/api/status');
      const data = await res.json();
      document.getElementById('airplay').textContent = data.airplay;
      document.getElementById('roon').textContent = data.roonbridge;
    }
    async function post(path) {
      await fetch(path, { method: 'POST' });
      await refresh();
    }
    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
